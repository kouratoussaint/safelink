# Mises à jour automatiques proposées en pull request, vérifiées par la CI.
# Les versions de Gradle, de l'AGP et de Kotlin suivent Flutter et sont
# mises à jour à la main avec le SDK (voir docs/BUILD.md).
version: 2
updates:
  - package-ecosystem: pub
    directory: /app
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dépendances]

  - package-ecosystem: pub
    directory: /packages/safelink_engine
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels: [dépendances]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dépendances]
