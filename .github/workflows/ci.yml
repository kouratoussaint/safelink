name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Lecture seule par défaut : aucun job de ce workflow n'écrit dans le dépôt
# ni n'utilise de secret. Le déclencheur pull_request (et non
# pull_request_target) garantit qu'une contribution externe ne voit aucun
# secret.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    name: Moteur (Dart pur)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/safelink_engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-flutter

      - name: Dépendances verrouillées
        run: dart pub get --enforce-lockfile

      - name: Formatage
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyse statique
        run: dart analyze --fatal-infos

      - name: Marques de référence à jour
        run: python3 ../../tools/generate_brands.py --check

      - name: Tests et couverture
        run: dart test --coverage-path=coverage/lcov.info

      - name: Couverture minimale de 90 %
        run: python3 ../../tools/check_coverage.py coverage/lcov.info 90

      - name: Évaluation du corpus de messages (seuils bloquants)
        run: dart run tool/evaluate_messages.dart --report "$GITHUB_STEP_SUMMARY"

  app:
    name: Application (tests et APK)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: ./.github/actions/setup-flutter

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle.kts', 'app/android/gradle/wrapper/gradle-wrapper.properties', '.flutter-version') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Dépendances verrouillées
        run: flutter pub get --enforce-lockfile

      - name: Traductions
        run: flutter gen-l10n

      - name: Formatage
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyse statique
        run: flutter analyze --fatal-infos

      - name: Tests (widgets, thèmes, accessibilité)
        run: flutter test

      - name: APK debug
        run: flutter build apk --debug --dart-define=SAFELINK_GIT_SHA=${{ github.sha }}

      - name: APK release de contrôle (non distribué)
        run: flutter build apk --release --dart-define=SAFELINK_GIT_SHA=${{ github.sha }}

      - name: Aucune permission hors liste autorisée
        # INTERNET : vérification en ligne du nom des sites (ADR 0010).
        run: ../tools/check_apk_permissions.sh build/app/outputs/flutter-apk/app-release.apk android.permission.INTERNET

      - name: Compatibilité avec les pages mémoire de 16 Ko
        run: python3 ../tools/check_16kb_alignment.py build/app/outputs/flutter-apk/app-release.apk

      - name: Publier l'APK debug
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: safelink-debug-${{ github.sha }}
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
