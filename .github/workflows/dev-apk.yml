name: APK de développement

# À chaque mise à jour de main ou d'une branche de lot, publie les APK
# optimisés (build release, environ cinq fois plus légers qu'un build debug)
# dans une pré-version GitHub « dev-<révision> », téléchargeable sans compte.
#
# Les APK sont signés avec la même clé de développement (secrets
# SAFELINK_DEV_KEYSTORE_BASE64 et SAFELINK_DEV_KEYSTORE_PASSWORD), pour
# qu'une nouvelle version s'installe par-dessus la précédente. Si ces secrets
# manquent, les APK sont quand même publiés, avec une signature temporaire
# signalée en tête des notes : la publication n'est jamais bloquée, mais le
# changement de signature n'est jamais silencieux. Cette clé n'est pas celle
# des versions de distribution (lot D).
on:
  push:
    branches:
      - main
      - 'lot-*/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publier les APK de développement
    # Jamais depuis une copie (fork) du dépôt : les secrets n'y sont pas.
    if: github.repository == 'kouratoussaint/safelink'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      # Nécessaire pour créer la pré-version et son tag.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Clé de signature de développement
        env:
          KEYSTORE_BASE64: ${{ secrets.SAFELINK_DEV_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SAFELINK_DEV_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" ]]; then
            echo "::warning::Secrets de la clé de développement absents : APK signés avec une clé temporaire (voir docs/BUILD.md)."
            echo "SIGNING=temporary" >> "$GITHUB_ENV"
            exit 0
          fi
          keystore="$RUNNER_TEMP/safelink-dev.p12"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          echo "SAFELINK_DEV_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          echo "SIGNING=stable" >> "$GITHUB_ENV"

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '21'

      - uses: ./.github/actions/setup-flutter

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('app/android/**/*.gradle.kts', 'app/android/gradle/wrapper/gradle-wrapper.properties', '.flutter-version') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: APK optimisés par architecture (téléphones ARM 64 et 32 bits)
        working-directory: app
        env:
          SAFELINK_DEV_KEYSTORE_PASSWORD: ${{ secrets.SAFELINK_DEV_KEYSTORE_PASSWORD }}
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --release --split-per-abi \
            --target-platform android-arm,android-arm64 \
            --dart-define=SAFELINK_GIT_SHA="${GITHUB_SHA::7}"

      - name: Effacer la clé du runner
        if: always()
        run: rm -f "$RUNNER_TEMP/safelink-dev.p12"

      - name: Vérifier la signature de chaque APK
        run: |
          set -o pipefail
          expected="$(tr -d '[:space:]' < tools/dev-signing-cert.sha256)"
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)"
          echo "apksigner : $apksigner ($("$apksigner" --version 2>&1 || true))"
          digest=""
          for apk in app/build/app/outputs/flutter-apk/app-*-release.apk; do
            name="$(basename "$apk")"
            report="$("$apksigner" verify --print-certs "$apk" 2>&1)" || {
              echo "::warning::apksigner n'a pas pu vérifier $name."
            }
            # Deux formats selon la version d'apksigner : « Signer #1
            # certificate… » (jusqu'à 0.8) et « V2 Signer: certificate… » (0.9).
            actual="$(printf '%s\n' "$report" |
              sed -nE 's/^(Signer #1|V[0-9.]+ Signer:) certificate SHA-256 digest: //p' |
              head -n 1)"
            echo "$name : ${actual:-empreinte illisible}"
            if [[ -z "$actual" ]]; then
              # Ne bloque pas la publication, mais le dit.
              echo "::warning::Empreinte du certificat illisible pour $name."
              printf '%s\n' "$report"
              continue
            fi
            if [[ "$SIGNING" == "stable" && "$actual" != "$expected" ]]; then
              echo "::error::$name n'est pas signé avec la clé de développement attendue."
              exit 1
            fi
            digest="$actual"
          done
          echo "CERT_SHA256=${digest:-non lue}" >> "$GITHUB_ENV"

      - name: Contrôler permissions et alignement 16 Ko
        run: |
          out=app/build/app/outputs/flutter-apk
          for apk in "$out"/app-*-release.apk; do
            # INTERNET : vérification en ligne du nom des sites (ADR 0010).
            tools/check_apk_permissions.sh "$apk" android.permission.INTERNET
          done
          # Les pages de 16 Ko ne concernent que les bibliothèques 64 bits.
          python3 tools/check_16kb_alignment.py "$out/app-arm64-v8a-release.apk"

      - name: Préparer les fichiers à publier
        run: |
          short="${GITHUB_SHA::7}"
          version="$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' app/pubspec.yaml)"
          out=app/build/app/outputs/flutter-apk
          mkdir dist
          for abi in arm64-v8a armeabi-v7a; do
            cp "$out/app-$abi-release.apk" "dist/SafeLink-$version-dev-$short-$abi.apk"
          done
          (cd dist && sha256sum ./*.apk | sed 's# \./# #' > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt
          echo "SHORT_SHA=$short" >> "$GITHUB_ENV"

      - name: Créer la pré-version
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          tag="dev-$SHORT_SHA"
          base="https://github.com/$GITHUB_REPOSITORY/releases/download/$tag"
          size() { awk -v b="$(stat -c%s "$1")" 'BEGIN { printf "%.1f Mo", b / 1000000 }' | tr . ,; }
          {
            echo "**Version de développement — pour essai uniquement, ne pas diffuser.**"
            echo
            if [[ "$SIGNING" != "stable" ]]; then
              echo "> **Signature temporaire** : la clé de développement n'est pas configurée. Désinstaller la version précédente avant d'installer celle-ci."
              echo
            fi
            echo "Branche \`$BRANCH\`, révision \`$GITHUB_SHA\`."
            echo
            echo "| Fichier | Taille | Pour qui |"
            echo "| --- | --- | --- |"
            for f in dist/*.apk; do
              name="$(basename "$f")"
              case "$name" in
                *arm64-v8a*) who="La plupart des téléphones" ;;
                *) who="Téléphones 32 bits (souvent Android Go)" ;;
              esac
              echo "| [$name]($base/$name) | $(size "$f") | $who |"
            done
            echo
            if [[ "$SIGNING" == "stable" ]]; then
              echo "- Signé avec la clé de développement SafeLink (certificat SHA-256 \`$CERT_SHA256\`) : s'installe par-dessus toute version de développement précédente signée avec cette clé."
            else
              echo "- Signature temporaire (certificat SHA-256 \`$CERT_SHA256\`)."
            fi
            echo "- Version optimisée (build release). Seule permission Android : Internet, pour la vérification en ligne du nom des sites, si l’utilisateur l’active."
            echo "- Empreintes des fichiers : \`SHA256SUMS.txt\`."
          } > notes.md
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          else
            gh release create "$tag" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --prerelease \
              --title "Développement $SHORT_SHA ($BRANCH)" \
              --notes-file notes.md
          fi
          cat notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Ne garder que les 5 dernières versions de développement
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 \
            --json tagName,isPrerelease,createdAt \
            --jq '[.[] | select(.isPrerelease and (.tagName | startswith("dev-")))]
                  | sort_by(.createdAt) | reverse | .[5:] | .[].tagName' |
          while read -r old; do
            echo "Suppression de $old"
            gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
          done
