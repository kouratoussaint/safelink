# Mémoire limitée à 4 Go pour tenir sur les runners GitHub (16 Go) et sur
# des machines de contributeurs modestes.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Drapeaux ajoutés par le gabarit Flutter 3.50.1.
android.newDsl=false
android.builtInKotlin=false
