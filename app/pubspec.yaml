name: safelink
description: >-
  SafeLink — Vérifiez avant de cliquer. Analyse locale des liens et des
  messages, gratuite, sans publicité et sans compte.
publish_to: none
# Version affichée / numéro de build Android. Les versions publiées sont
# dérivées des tags Git vMAJEUR.MINEUR.CORRECTIF (voir docs/BUILD.md).
version: 0.0.1+1

environment:
  sdk: ^3.14.0
  flutter: 3.50.1

dependencies:
  crypto: ^3.0.8
  cryptography: ^2.9.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.5.1
  go_router: ^18.1.4
  http2: ^3.2.0
  intl: any
  material_ui: ^1.11.1
  package_info_plus: ^10.2.2
  path: ^1.9.1
  safelink_engine:
    path: ../packages/safelink_engine
  shared_preferences: ^2.5.6
  sqflite: ^2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  sqflite_common_ffi: ^2.4.7
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/brand/
    - assets/fonts/OFL-Poppins.txt
    - assets/fonts/OFL-Inter.txt
    - assets/licenses/public_suffix_list.txt
    - assets/licenses/unicode.txt
  # Polices embarquées (SIL Open Font License 1.1) : aucune police n'est
  # téléchargée au lancement.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
